<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>つぎて帳｜並べて見る</title>
  <link rel="icon" href="/img/icon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/img/icon-180.png" />
  <link rel="stylesheet" href="/app.css" />
  <style>
    .pair { display: flex; gap: 22px; justify-content: center; padding: 16px; flex-wrap: wrap; }
    .phone { text-align: center; }
    .phone iframe { width: 390px; height: 780px; border: 1px solid var(--line); border-radius: 28px; background: #fff; }
    .phone .label { font-weight: 700; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="bar" hidden style="text-align:center;padding:10px 0 0"><button class="btn ghost" id="swap" style="font-size:13px;padding:4px 12px">真ん中を大西さんにする</button></div>
  <div class="pair" id="pair"><p class="muted">デモの入口から開いてください。</p></div>
  <script>
    // 専用リンクの合言葉は # のあとに入れて渡す（サーバーの記録に残らないように）
    let k = {};
    try { k = JSON.parse(decodeURIComponent(location.hash.slice(1)) || '{}'); } catch {}
    const q = (s) => encodeURIComponent(s || '');
    if (k.a && k.b) {
      const phone = (label, path, key, title, mic) =>
        `<div class="phone"><div class="label">${label}</div><iframe src="${path}?k=${q(key)}" title="${title}"${mic ? ' allow="microphone"' : ''}></iframe></div>`;
      const mid = { b: phone('本人：川端さん', '/honnin', k.b, '川端さんの画面', true), d: k.d ? phone('本人：大西さん', '/honnin', k.d, '大西さんの画面', true) : '' };
      document.getElementById('pair').innerHTML =
        phone('新人：青木さん', '/tsugu', k.a, '青木さんの画面', true) +
        `<div id="mid-b">${mid.b}</div><div id="mid-d" hidden>${mid.d}</div>` +
        (k.c ? phone('町の担当者', '/machi', k.c, '町の担当者の画面', false) : '');
      if (k.d) {
        // 真ん中だけ入れ替える（左右の画面は読み込み直さない）
        document.getElementById('bar').hidden = false;
        const swap = document.getElementById('swap');
        swap.addEventListener('click', () => {
          const showD = document.getElementById('mid-d').hidden;
          document.getElementById('mid-d').hidden = !showD;
          document.getElementById('mid-b').hidden = showD;
          swap.textContent = showD ? '真ん中を川端さんにもどす' : '真ん中を大西さんにする';
        });
      }
    }
  </script>
</body>
</html>
