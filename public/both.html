<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>つぎて帳｜並べて見る</title>
  <link rel="stylesheet" href="/app.css" />
  <style>
    .pair { display: flex; gap: 28px; justify-content: center; padding: 16px; flex-wrap: wrap; }
    .phone { text-align: center; }
    .phone iframe { width: 390px; height: 780px; border: 1px solid var(--line); border-radius: 28px; background: #fff; }
    .phone .label { font-weight: 700; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="pair">
    <div class="phone"><div class="label">継ぐ人：健太さん</div><iframe src="/tsugu" title="健太さんの画面"></iframe></div>
    <div class="phone"><div class="label">本人：山野さん</div><iframe src="/honnin" title="山野さんの画面" allow="microphone"></iframe></div>
  </div>
</body>
</html>
